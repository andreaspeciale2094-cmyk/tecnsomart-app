<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. sfondo</title>
<style>
  :root { --red:#ff2a3d; --gold:#ffb454; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; cursor:none; }
  body { background:
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(255,42,61,.16), transparent 70%),
      linear-gradient(rgba(255,42,61,.03) 1px, transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg, rgba(255,42,61,.03) 1px, transparent 1px) 0 0/48px 48px, #03040a;
    font-family:"Segoe UI", system-ui, sans-serif; }
  #visore { position:fixed; inset:0; display:block; }
  #rete { position:absolute; inset:0; width:100%; height:100%; }
  #orb { display:none; }
  #nome { position:fixed; left:50%; bottom:5vh; transform:translateX(-50%); text-align:center; color:#fff; pointer-events:none; }
  #nome h1 { margin:0; font-size:clamp(14px,1.6vw,26px); letter-spacing:.7em; font-weight:600; text-shadow:0 0 18px rgba(255,42,61,.8); }
  #fase { margin-top:8px; font-size:clamp(10px,1vw,15px); letter-spacing:.3em; text-transform:uppercase; color:var(--red); font-family:ui-monospace, Consolas, monospace; transition:color .3s; }
  #fase.oro { color:var(--gold); }
</style>
</head>
<body class="solovoce">
<!-- Sfondo animato del PC: solo la rete neurale (si muove quando Jarvis ti ascolta o parla). Niente chat, niente login, niente testi privati. -->
<div id="orb"></div>
<div id="visore"><canvas id="rete"></canvas></div>
<div id="nome"><h1>J.A.R.V.I.S.</h1><div id="fase"></div></div>
<script>
  // leggero per default (30 fotogrammi al secondo, senza bagliori); per la versione piena apri sfondo.html?effetti=1
  if (!/effetti=1/.test(location.search)) document.body.classList.add('calmo');
  const orb = document.getElementById('orb'), fase = document.getElementById('fase');
  const NOMI = { 'ti ascolto': 'ti ascolto', 'capisco': 'capisco', 'rispondo': 'rispondo', 'parlo': 'rispondo' };
  async function aggiorna() {
    try {
      const a = await (await fetch('/api/stato_ascolto', { cache: 'no-store' })).json();
      const f = a.fase || '';
      orb.className = f === 'rispondo' || f === 'parlo' ? 'speaking' : f === 'capisco' ? 'thinking' : f === 'ti ascolto' ? 'listening' : '';
      fase.textContent = !a.attivo ? 'ascolto spento' : f ? NOMI[f] || f : (a.in_ascolto ? 'in ascolto' : '');
      fase.className = orb.className === 'listening' ? 'oro' : '';
    } catch (e) { fase.textContent = ''; orb.className = ''; }
  }
  aggiorna(); setInterval(aggiorna, 700);
</script>
<script>window.RETE_SCALA = 0.82;</script>
<script src="/static/rete.js"></script>
</body>
</html>
