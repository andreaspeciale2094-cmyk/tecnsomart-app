<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#04050a">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#04050a; --panel:#0c0d14; --red:#ff2a3d; --red2:#b3121f; --red-dim:#5a0f18; --gold:#ffb454; --dim:#8b8f9c; --text:#ecedf2; --line:#2a1519; }
  * { box-sizing: border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; color:var(--text); overflow:hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 80% 55% at 50% -10%, rgba(255,42,61,.18), transparent 70%),
      linear-gradient(rgba(255,42,61,.035) 1px, transparent 1px) 0 0/44px 44px,
      linear-gradient(90deg, rgba(255,42,61,.035) 1px, transparent 1px) 0 0/44px 44px,
      var(--bg); }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:20;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); opacity:.35; }
  body.calmo::after { display:none; }
  header { display:flex; align-items:center; gap:16px; padding:14px 18px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,42,61,.07), transparent); position:relative; }
  header::after { content:""; position:absolute; left:0; bottom:-1px; width:180px; height:2px; background:linear-gradient(90deg, var(--red), transparent); }
  /* sfera: anelli che cambiano con lo stato (pronto, ti ascolto, sto pensando, parla) */
  #orb { position:relative; width:46px; height:46px; border-radius:50%; flex:none; margin:8px 22px 8px 20px;
    background:radial-gradient(circle at 50% 45%, #fff 0, #ff7a86 18%, var(--red) 40%, var(--red2) 68%, #3a0a10 100%);
    box-shadow:0 0 22px rgba(255,42,61,.8), 0 0 60px rgba(255,42,61,.35); transition:box-shadow .3s; }
  #orb::before, #orb::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(255,42,61,.55); pointer-events:none; }
  #orb::before { inset:-9px; border-style:dashed; animation:gira 14s linear infinite; }
  #orb::after { inset:-17px; border-color:rgba(255,42,61,.22); animation:gira 24s linear infinite reverse; }
  #orb.listening { background:radial-gradient(circle at 50% 45%, #fff 0, #ffe1a8 18%, var(--gold) 40%, #b36a12 70%, #3a2305 100%);
    box-shadow:0 0 26px rgba(255,180,84,.85), 0 0 70px rgba(255,180,84,.35); animation:respira 1.6s ease-in-out infinite; }
  #orb.listening::before, #orb.listening::after { border-color:rgba(255,180,84,.6); }
  #orb.thinking { animation:respira .9s ease-in-out infinite; }
  #orb.thinking::before { animation-duration:2.2s; border-style:solid; border-color:var(--red); border-top-color:transparent; border-bottom-color:transparent; }
  #orb.speaking { animation:parla .5s ease-in-out infinite; }
  @keyframes gira { to { transform:rotate(360deg); } }
  @keyframes respira { 50% { transform:scale(1.14); } }
  @keyframes parla { 50% { transform:scale(1.08); box-shadow:0 0 34px rgba(255,42,61,1), 0 0 90px rgba(255,42,61,.5); } }
  body.calmo #orb, body.calmo #orb::before, body.calmo #orb::after { animation:none !important; }
  h1 { font-size:15px; letter-spacing:.5em; margin:0; font-weight:600; color:#fff; text-shadow:0 0 14px rgba(255,42,61,.6); }
  #status { color:var(--red); font-size:11px; letter-spacing:.18em; text-transform:uppercase; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; margin-top:3px; }
  #asc { font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-family:ui-monospace, Consolas, monospace; margin-top:3px; color:var(--dim); }
  #asc.ok { color:var(--gold); } #asc.no { color:#ff8a8a; }
  #asc { cursor:pointer; display:flex; align-items:center; gap:8px; flex-wrap:wrap; } #asc:hover { color:#fff; }
  #asc .liv { width:60px; height:6px; background:#1a0a0e; border:1px solid var(--red-dim); position:relative; } #asc .liv i { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--red); box-shadow:0 0 6px var(--red); transition:width .1s; }
  #asc .mic { color:var(--dim); max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .spacer { flex:1; }
  header button { background:rgba(255,42,61,.04); border:1px solid var(--red-dim); color:var(--dim); border-radius:4px; padding:7px 11px; cursor:pointer; font-size:11px;
    letter-spacing:.06em; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; text-transform:uppercase; transition:.2s;
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  header button:hover { color:#fff; border-color:var(--red); background:rgba(255,42,61,.12); }
  header button.on { color:#fff; border-color:var(--red); background:rgba(255,42,61,.18); box-shadow:0 0 12px rgba(255,42,61,.35) inset; }
  #visore { display:none; flex:0 0 42%; min-height:180px; position:relative; border-bottom:1px solid var(--line);
    background:radial-gradient(ellipse 60% 80% at 50% 50%, rgba(255,42,61,.07), transparent 70%); }
  body.conrete #visore { display:block; }
  /* modo voce (predefinito): la rete riempie la finestra, niente chat scritta; i sottotitoli mostrano cosa dice Jarvis */
  body.solovoce #visore { display:block; flex:1 1 auto; border-bottom:0; }
  body.solovoce #log, body.solovoce #f { display:none; }
  /* riquadri informativi sulla rete: ora, impegni, posta, WhatsApp (il pulsante privacy li nasconde) */
  #hud { position:absolute; inset:0; pointer-events:none; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; text-transform:uppercase; letter-spacing:.14em; }
  body.privacy #hud { display:none; }
  .box { position:absolute; padding:10px 14px; border-left:2px solid var(--red); background:linear-gradient(90deg, rgba(255,42,61,.10), transparent); font-size:11px; color:var(--dim); line-height:1.7; max-width:44%; }
  .box b { color:#fff; font-weight:600; font-size:15px; letter-spacing:.06em; }
  .box .t { color:var(--red); font-size:10px; display:flex; align-items:center; gap:7px; }
  .box .t svg { width:17px; height:17px; fill:none; stroke:var(--red); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 4px rgba(255,42,61,.6)); }
  #hud-sx, #hud-bs { display:none; }
  #hud-sx { left:3%; top:5%; } #hud-dx { right:3%; top:5%; text-align:right; border-left:0; border-right:2px solid var(--red); background:linear-gradient(270deg, rgba(255,42,61,.10), transparent); }
  #hud-bs { left:3%; bottom:5%; }
  #hud-dx { display:flex; align-items:center; gap:16px; max-width:70%; }
  #meteo { display:none; white-space:nowrap; padding-right:16px; border-right:1px solid var(--line); text-align:right; font-size:9px; letter-spacing:.1em; color:var(--dim); line-height:1.5; }
  #meteo .gr { display:flex; align-items:center; justify-content:flex-end; gap:6px; } #meteo b { color:#fff; font-size:15px; font-weight:300; letter-spacing:.04em; text-shadow:0 0 10px rgba(255,42,61,.5); }
  #meteo svg { width:20px; height:20px; fill:none; stroke:var(--red); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 4px rgba(255,42,61,.6)); }
  #ora { font-size:clamp(26px,4vw,52px); color:#fff; letter-spacing:.08em; text-shadow:0 0 18px rgba(255,42,61,.6); font-weight:300; }
  body:not(.solovoce) #hud { display:none; }
  #didascalia { position:absolute; left:50%; bottom:4%; transform:translateX(-50%); width:min(820px,90%); text-align:center; pointer-events:none;
    font-size:clamp(15px,2.2vw,22px); line-height:1.45; color:#fff; text-shadow:0 0 18px rgba(255,42,61,.9), 0 2px 6px #000; max-height:30%; overflow:hidden; }
  #didascalia .tu { display:block; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--red); margin-bottom:6px; font-family:ui-monospace, Consolas, monospace; }
  #didascalia:empty { display:none; }
  #rete { position:absolute; inset:0; width:100%; height:100%; }
  #log { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; scrollbar-color:var(--red-dim) transparent; }
  .msg { max-width:min(740px,88%); padding:11px 16px; line-height:1.5; white-space:pre-wrap; animation:entra .25s ease-out;
    clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
  body.calmo .msg { animation:none; }
  @keyframes entra { from { opacity:0; transform:translateY(6px); } }
  .user { align-self:flex-end; background:linear-gradient(135deg, #3a0f15, #1c0a0e); border-right:2px solid var(--red); }
  .jarvis { align-self:flex-start; background:linear-gradient(135deg, rgba(255,255,255,.055), rgba(255,255,255,.015)); border-left:2px solid var(--gold); }
  .tools { font-size:10.5px; color:var(--dim); margin-top:7px; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing:.04em; }
  form { display:flex; gap:10px; padding:14px 18px 20px; border-top:1px solid var(--line); background:linear-gradient(0deg, rgba(255,42,61,.06), transparent); }
  input { flex:1; min-width:0; background:rgba(12,13,20,.9); border:1px solid var(--red-dim); color:var(--text); padding:13px 16px; font-size:16px; outline:none; border-radius:2px;
    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition:.2s; }
  input:focus { border-color:var(--red); box-shadow:0 0 18px rgba(255,42,61,.25); }
  input::placeholder { color:#5d606c; }
  form button { flex:none; background:linear-gradient(135deg, var(--red), var(--red2)); color:#fff; border:0; padding:0 22px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; font-size:12px;
    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition:.2s; }
  form button:hover { filter:brightness(1.2); box-shadow:0 0 18px rgba(255,42,61,.6); }
  #mic { background:#2a0d12; color:var(--red); border:1px solid var(--red-dim); padding:0 16px; }
  #mic.on { background:var(--gold); color:#2a1700; animation:respira 1.2s infinite; }
  body.calmo #mic.on { animation:none; }
  /* app sul desktop di Jarvis: nello stesso stile dei riquadri (barra rossa, scritte in maiuscolo), divise tra sinistra e destra */
  .desk { position:absolute; display:flex; gap:6px; pointer-events:none; z-index:6; max-width:30%; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; }
  #desk-sx { left:2.2%; top:31%; bottom:19%; flex-flow:column wrap; align-content:flex-start; }
  #desk-dx { right:2.2%; top:31%; bottom:19%; flex-flow:column wrap-reverse; align-content:flex-start; align-items:flex-end; }
  body:not(.solovoce) .desk { display:none; }
  .ico { pointer-events:auto; position:relative; width:clamp(160px,12.5vw,225px); display:flex; align-items:center; gap:10px; padding:clamp(4px,.4vw,7px) clamp(8px,.7vw,12px); border:0; border-left:2px solid var(--red); text-align:left; cursor:pointer;
    background:linear-gradient(90deg, rgba(255,42,61,.10), transparent); color:#fff; font-size:clamp(10px,.8vw,12.5px); letter-spacing:.09em; text-transform:uppercase; transition:background .15s, box-shadow .15s, transform .15s, border-color .15s; }
  .ico.dx { flex-direction:row-reverse; text-align:right; border-left:0; border-right:2px solid var(--red); background:linear-gradient(270deg, rgba(255,42,61,.10), transparent); }
  .ico .logo { flex:none; width:clamp(26px,2.1vw,36px); height:clamp(26px,2.1vw,36px); display:flex; align-items:center; justify-content:center; border:1px solid var(--red-dim); background:rgba(255,42,61,.07); }
  .ico .logo img { width:78%; height:78%; object-fit:contain; }
  .ico .logo svg { width:56%; height:56%; fill:none; stroke:var(--red); stroke-width:1.8; stroke-linecap:round; }
  .ico .logo .let { font-weight:700; font-size:clamp(10px,.85vw,14px); color:var(--red); }
  .ico .et { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ico.piu { color:var(--dim); }
  .ico:hover { background:linear-gradient(90deg, rgba(255,42,61,.30), rgba(255,42,61,.04)); box-shadow:0 0 18px rgba(255,42,61,.4); transform:translateX(4px); color:#fff; border-color:#ff7a86; }
  .ico.dx:hover { background:linear-gradient(270deg, rgba(255,42,61,.30), rgba(255,42,61,.04)); transform:translateX(-4px); }
  .ico:hover .logo { border-color:var(--red); }
  .ico:active { background:rgba(255,42,61,.38); }
  .ico .bd { flex:none; min-width:clamp(18px,1.3vw,22px); height:clamp(18px,1.3vw,22px); padding:0 5px; border-radius:11px; background:var(--red); color:#fff; font:700 clamp(10px,.75vw,12px) ui-monospace, monospace; letter-spacing:0; display:flex; align-items:center; justify-content:center; box-shadow:0 0 10px rgba(255,42,61,.7); }
  .ico .x { display:none; position:absolute; top:-7px; right:-7px; width:18px; height:18px; border-radius:50%; background:#1a0a0e; border:1px solid var(--red); color:#fff; font:700 12px/1 sans-serif; align-items:center; justify-content:center; cursor:pointer; z-index:2; }
  .ico.dx .x { right:auto; left:-7px; }
  .ico:hover .x { display:flex; } .ico .x:hover { background:var(--red); }
  /* avvisi dell'agente vigile: compaiono solo quando c'e' qualcosa che conta */
  #avvisi { position:fixed; top:104px; left:50%; transform:translateX(-50%); width:min(540px,92%); display:flex; flex-direction:column; gap:8px; z-index:28; pointer-events:none; }
  body.privacy #avvisi { display:none; }
  .avviso { pointer-events:auto; position:relative; display:flex; align-items:center; gap:12px; padding:10px 34px 10px 14px; cursor:pointer; border-left:3px solid var(--red); color:#fff; font-size:14px; line-height:1.4;
    background:linear-gradient(90deg, rgba(40,8,13,.97), rgba(14,5,8,.95)); box-shadow:0 0 22px rgba(255,42,61,.28); animation:entra .3s ease-out; transition:transform .15s, box-shadow .15s; }
  .avviso.urgente { border-left-color:var(--gold); box-shadow:0 0 26px rgba(255,180,84,.35); }
  .avviso:hover { transform:translateX(4px); box-shadow:0 0 30px rgba(255,42,61,.5); }
  .avviso .tag { flex:none; font:10px ui-monospace, Consolas, monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--red); } .avviso.urgente .tag { color:var(--gold); }
  .avviso .prev { color:var(--dim); font-size:13px; font-style:italic; margin-top:2px; }
  .avviso .bt { margin-left:10px; padding:4px 12px; border:1px solid var(--red); background:transparent; color:#fff; font:12px ui-monospace, Consolas, monospace; letter-spacing:.08em; cursor:pointer; } .avviso .bt:hover { background:var(--red); }
  .avviso .x { position:absolute; top:6px; right:8px; width:20px; height:20px; border:0; background:transparent; color:var(--dim); font-size:16px; cursor:pointer; line-height:1; } .avviso .x:hover { color:#fff; }
  /* riquadri cliccabili: cambiano aspetto al passaggio del mouse */
  .box .cl { pointer-events:auto; cursor:pointer; padding:6px 10px; margin:-6px -10px; transition:background .15s, box-shadow .15s, transform .15s; }
  .box .cl:hover { background:linear-gradient(90deg, rgba(255,42,61,.22), transparent); box-shadow:0 0 16px rgba(255,42,61,.3); transform:translateX(3px); }
  .box .cl .t::after { content:"  ›"; opacity:.7; font-size:13px; } .box .cl:hover .t::after { content:"  ↗ apri"; opacity:1; }
  .box .sub { display:inline-block; margin-top:3px; color:var(--red); font-size:10px; letter-spacing:.12em; padding:1px 0; border-bottom:1px dashed transparent; } .box .sub:hover { color:#fff; border-bottom-color:var(--red); }
  .box .cl + .cl, .box div + .cl { margin-top:6px; }
  /* finestra dei dettagli (impegni, WhatsApp) */
  #int { display:none; position:fixed; inset:0; z-index:36; background:rgba(2,2,5,.82); align-items:center; justify-content:center; } #int.on { display:flex; }
  #int .intbox { width:min(600px,94%); max-height:86vh; } #int-b { overflow-y:auto; min-height:80px; display:flex; flex-direction:column; gap:6px; scrollbar-width:thin; scrollbar-color:var(--red-dim) transparent; }
  #int .sezt { font:10px ui-monospace, Consolas, monospace; letter-spacing:.16em; text-transform:uppercase; color:var(--red); margin-top:8px; }
  #int .dim { color:var(--dim); font-size:13px; } #int .err { color:#ff8a8a; font-size:13px; } #int .dett { font-size:13px; color:var(--text); } #int .desc { font-size:12.5px; color:var(--dim); white-space:pre-wrap; border-left:2px solid var(--red-dim); padding-left:10px; margin:4px 0; max-height:140px; overflow-y:auto; }
  #int .riga { display:flex; gap:12px; align-items:baseline; width:100%; text-align:left; background:transparent; border:0; border-left:2px solid var(--red-dim); color:var(--text); padding:9px 12px; font-size:14px; cursor:pointer; transition:.12s; }
  #int .riga:hover { background:rgba(255,42,61,.16); border-left-color:var(--red); color:#fff; padding-left:18px; }
  #int .riga .q { flex:none; width:96px; font:12px ui-monospace, Consolas, monospace; color:var(--red); } #int .riga .n { flex:1; min-width:0; } #int .riga .b { flex:none; min-width:22px; text-align:center; background:var(--red); color:#fff; border-radius:11px; font:700 11px ui-monospace, monospace; padding:2px 7px; }
  #int .gruppo { display:flex; flex-wrap:wrap; gap:8px; }
  #int .ib { padding:8px 14px; background:transparent; border:1px solid var(--red-dim); color:var(--text); font-size:13px; cursor:pointer; transition:.12s; }
  #int .ib:hover:not(:disabled) { border-color:var(--red); background:rgba(255,42,61,.18); color:#fff; box-shadow:0 0 12px rgba(255,42,61,.3); } #int .ib:disabled { opacity:.45; cursor:default; }
  #int .ib.ok { background:linear-gradient(135deg, var(--red), var(--red2)); border-color:var(--red); color:#fff; font-weight:700; } #int .ib.ind, #int .ib.alt { color:var(--dim); }
  #int .bolla { max-width:84%; padding:8px 12px; font-size:13.5px; line-height:1.45; white-space:pre-wrap; background:rgba(255,255,255,.05); border-left:2px solid var(--gold); } #int .bolla.mio { align-self:flex-end; background:rgba(255,42,61,.12); border-left:0; border-right:2px solid var(--red); }
  #int .bolla small { display:block; font:10px ui-monospace, monospace; color:var(--dim); margin-top:3px; }
  #int .citaz { white-space:pre-wrap; font-size:14px; line-height:1.5; padding:12px 14px; background:rgba(255,42,61,.08); border:1px solid var(--red-dim); border-left:3px solid var(--red); color:#fff; }
  #int textarea, #int input { width:100%; background:rgba(12,13,20,.9); border:1px solid var(--red-dim); color:var(--text); padding:10px 12px; font:14px "Segoe UI", system-ui, sans-serif; outline:none; resize:vertical; clip-path:none; } #int textarea { min-height:84px; } #int textarea:focus, #int input:focus { border-color:var(--red); box-shadow:0 0 14px rgba(255,42,61,.25); }
  #picker { display:none; position:fixed; inset:0; z-index:35; background:rgba(2,2,5,.82); align-items:center; justify-content:center; } #picker.on { display:flex; }
  #picker .pk, #int .pk { width:min(460px,92%); max-height:80vh; display:flex; flex-direction:column; gap:10px; padding:18px; background:linear-gradient(135deg, #1c0a0e, #0c0508); border:1px solid var(--red-dim); border-top:2px solid var(--red); box-shadow:0 0 40px rgba(255,42,61,.25); }
  #picker .pkt, #int .pkt { letter-spacing:.2em; text-transform:uppercase; color:#fff; font-size:13px; } #picker .pkn, #int .pkn { font-size:11px; color:var(--dim); }
  #pk-l { overflow-y:auto; min-height:120px; display:flex; flex-direction:column; scrollbar-width:thin; scrollbar-color:var(--red-dim) transparent; }
  #pk-l button { text-align:left; background:transparent; border:0; border-left:2px solid transparent; color:var(--text); padding:9px 12px; font-size:14px; cursor:pointer; transition:.12s; }
  #pk-l button:hover { background:rgba(255,42,61,.14); border-left-color:var(--red); color:#fff; padding-left:18px; }
  /* barra in basso (come quella di Windows, ma nello stile di Jarvis): Start, app del Desktop, finestre aperte, uscita dal tutto schermo, ora */
  #barra { display:none; flex:none; align-items:center; gap:4px; height:54px; padding:0 10px; position:relative; z-index:25;
    background:linear-gradient(0deg, rgba(14,5,8,.97), rgba(24,7,11,.92)); border-top:1px solid var(--red-dim); box-shadow:0 -6px 24px rgba(255,42,61,.10); }
  body.conbarra #barra { display:flex; }
  #barra::before { content:""; position:absolute; left:0; top:-1px; width:220px; height:2px; background:linear-gradient(90deg, var(--red), transparent); }
  #barra .vb { position:relative; flex:none; width:42px; height:42px; display:flex; align-items:center; justify-content:center; background:transparent; border:1px solid transparent; border-radius:3px;
    cursor:pointer; padding:0; color:var(--text); transition:background .15s, border-color .15s, box-shadow .15s, transform .15s; }
  #barra .vb:hover { background:rgba(255,42,61,.14); border-color:var(--red); box-shadow:0 0 14px rgba(255,42,61,.45); transform:translateY(-2px); }

// Estrae le frasi complete dal testo che arriva a pezzi (min. 12 caratteri, tranne l'ultima)
function takeSentences(buf, final) {

// Un frase ascoltata: comandi di stop, aggiunta alla richiesta di prima, oppure richiesta nuova

  if (wakeOn && !overSpeech && !interrupted) { const m = t.match(WAKE_RE); if (!m || !m[2]) return; t = m[2].trim(); }

  if (interrupted && lastUserText) {
    const full = `Richiesta di prima: «${lastUserText}». Mi sono interrotto per aggiungere: «${t}». Rianalizza tutto e rispondi.`;

function startRec() {

    } catch (e) {}
  }
  const chiudiPicker = () => $('#picker').classList.remove('on');
  async function apriPicker() { const pk = $('#picker'); pk.querySelectorAll('.sens').forEach(x => x.remove()); pk.querySelector('.pkt').textContent = 'Aggiungi alla schermata di Jarvis'; pk.querySelector('.pkn').textContent = 'Non cambia niente in Windows: l\'app resta dov\'è. Puoi anche dire: «aggiungi Spotify al desktop».'; $('#pk-q').style.display = ''; pk.classList.add('on'); $('#pk-q').value = ''; $('#pk-l').textContent = 'Cerco le app…'; $('#pk-q').focus();
    try { const nomi = (await (await api('/api/desk/catalogo')).json()).nomi; const mostra = () => { const q = $('#pk-q').value.trim().toLowerCase();
        $('#pk-l').replaceChildren(...nomi.filter(n => n.toLowerCase().includes(q)).slice(0, 80).map(n => { const b = document.createElement('button'); b.textContent = n;
          b.onclick = () => postD('aggiungi', n).then(() => { chiudiPicker(); firmaDesk = ''; disegnaDesk(); }).catch(() => { b.textContent = n + ' — non riesco ad aggiungerla'; }); return b; })); };
      $('#pk-q').oninput = mostra; mostra(); } catch (e) { $('#pk-l').textContent = 'Non riesco a leggere l\'elenco delle app.'; } }
  $('#picker').onclick = e => { if (e.target.id === 'picker') chiudiPicker(); };
  addEventListener('keydown', e => { if (e.key === 'Escape') chiudiPicker(); });
  disegnaDesk(); setInterval(disegnaDesk, 3000); }
// riquadri cliccabili: impegni e WhatsApp. Ogni testo mostrato e' messo come testo semplice. Un messaggio parte SOLO dopo il clic su "Invia" (vedi il testo prima).
{ const M = $('#int'), T = $('#int-t'), Bd = $('#int-b'), N = $('#int-n');
  const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const btn = (txt, f, cls) => { const b = h('button', 'ib ' + (cls || ''), txt); b.onclick = f; return b; };
  const chiudi = () => M.classList.remove('on');
  const apri = (titolo, nota) => { T.textContent = titolo; N.textContent = nota || ''; M.classList.add('on'); };
  const chiama = async (path, corpo) => { const r = await fetch(path, { credentials: 'same-origin', method: corpo ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: corpo ? JSON.stringify(corpo) : undefined });
    if (r.status === 401) { showLogin(); throw new Error('Serve il login.'); } const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Qualcosa non ha funzionato.'); return d; };
  const mostra = (...nodi) => Bd.replaceChildren(...nodi);
  const attendi = (txt) => mostra(h('div', 'dim', txt || 'Un attimo…'));
  const guasto = (e, indietro) => mostra(h('div', 'err', e.message), ...(indietro ? [btn('← indietro', indietro, 'ind')] : []));

  // ---- impegni ----
  async function vistaImpegni() { apri('Impegni di oggi', 'Clicca un impegno per vedere i dettagli e scrivere alla persona.'); attendi('Leggo il calendario…');
    try { const d = await chiama('/api/impegni'); const nodi = [];
      for (const c of d.calendari) { nodi.push(h('div', 'sezt', 'Calendario ' + c.calendario));
        if (c.errore) nodi.push(h('div', 'dim', c.errore)); else if (!c.eventi.length) nodi.push(h('div', 'dim', 'Nessun impegno.'));
        for (const ev of c.eventi) { const r = h('button', 'riga'); r.append(h('span', 'q', ev.quando), h('span', 'n', ev.titolo)); r.onclick = () => vistaEvento(ev); nodi.push(r); } }
      mostra(...nodi); } catch (e) { guasto(e); } }
  function vistaEvento(ev) { apri(ev.titolo, ''); const nodi = [btn('← indietro', vistaImpegni, 'ind'), h('div', 'dett', 'Quando: ' + ev.quando)];
    if (ev.luogo) nodi.push(h('div', 'dett', 'Dove: ' + ev.luogo)); if (ev.partecipanti.length) nodi.push(h('div', 'dett', 'Con: ' + ev.partecipanti.join(', '))); if (ev.descrizione) nodi.push(h('div', 'desc', ev.descrizione));
    nodi.push(h('div', 'sezt', 'Scrivi su WhatsApp')); const g = h('div', 'gruppo');
    ev.contatti.forEach(n => g.append(btn(n, () => vistaScrivi({ nome: n, indietro: () => vistaEvento(ev) }))));
    g.append(btn('Un\'altra persona…', () => vistaScrivi({ nome: '', indietro: () => vistaEvento(ev) }), 'alt')); nodi.push(g); mostra(...nodi); }

  // ---- WhatsApp ----
  async function vistaWhatsApp() { apri('WhatsApp', 'Messaggi non letti. Clicca una chat per leggerla e rispondere.'); attendi('Leggo i messaggi…');
    try { const d = await chiama('/api/whatsapp/chat'); const nodi = [];
      if (!d.chat.length) nodi.push(h('div', 'dim', 'Nessun messaggio nuovo.'));
      for (const c of d.chat) { const r = h('button', 'riga'); r.append(h('span', 'n', c.nome), h('span', 'b', String(c.non_lette))); r.onclick = () => vistaChat(c); nodi.push(r); }
      nodi.push(btn('✉ Scrivi a qualcuno…', () => vistaScrivi({ nome: '', indietro: vistaWhatsApp }), 'alt'), btn('Apri l\'app WhatsApp', () => chiama('/api/whatsapp/app', {}).then(chiudi).catch(() => {}), 'alt')); mostra(...nodi); } catch (e) { guasto(e); } }
  async function vistaChat(c) { apri(c.nome, 'Letta solo qui: a chi ha scritto non arriva nessuna spunta blu.'); attendi('Apro la chat…');
    try { const d = await chiama('/api/whatsapp/messaggi?id=' + encodeURIComponent(c.id)); const nodi = [btn('← indietro', vistaWhatsApp, 'ind')];
      for (const m of d.messaggi) { const b = h('div', 'bolla' + (m.da_me ? ' mio' : ''), m.testo); b.append(h('small', '', (m.da_me ? 'tu' : d.nome) + ' · ' + m.ora)); nodi.push(b); }
      if (d.in_rubrica) nodi.push(btn('↩ Rispondi', () => vistaScrivi({ nome: d.nome, indietro: () => vistaChat(c) }), 'ok'));
      else if (d.numero_noto) { const nm = h('input'); nm.placeholder = 'Che nome gli dai in rubrica?'; nm.value = c.nome.startsWith('+') ? '' : c.nome; const st = h('div', 'dim', 'Questa persona non e\' ancora nella tua rubrica: per rispondere va salvata (resta solo sul tuo PC).');
        nodi.push(st, nm, btn('Salva in rubrica', async () => { try { await chiama('/api/whatsapp/salva', { chat_id: c.id, nome: nm.value.trim() }); vistaChat(c); } catch (e) { st.textContent = e.message; st.className = 'err'; } }));
      } else nodi.push(h('div', 'dim', 'Di questa chat WhatsApp non mi dice il numero, quindi da qui non posso rispondere.'));
      mostra(...nodi); Bd.scrollTop = Bd.scrollHeight; } catch (e) { guasto(e, vistaWhatsApp); } }

  // ---- scrivere e confermare ----
  async function vistaScrivi({ nome, indietro, testo = '' }) { apri(nome ? 'Messaggio per ' + nome : 'Scrivi su WhatsApp', 'Prima vedi il testo, poi premi Invia: senza il tuo clic non parte niente.');
    const nodi = [btn('← indietro', indietro, 'ind')]; let campo = null;
    if (!nome) { campo = h('input'); campo.placeholder = 'A chi? Scrivi un nome della rubrica'; campo.setAttribute('list', 'dl-rubrica'); nodi.push(campo);
      if (!$('#dl-rubrica')) { const dl = h('datalist'); dl.id = 'dl-rubrica'; document.body.append(dl); } chiama('/api/whatsapp/rubrica').then(d => $('#dl-rubrica').replaceChildren(...d.nomi.map(n => { const o = h('option'); o.value = n; return o; }))).catch(() => {}); }
    const ta = h('textarea'); ta.placeholder = 'Scrivi il messaggio…'; ta.value = testo; nodi.push(ta); const er = h('div', 'err');
    nodi.push(btn('Prepara il messaggio', async () => { er.textContent = ''; const a = (campo ? campo.value : nome).trim(); if (!a) { er.textContent = 'Scrivi a chi vuoi mandarlo.'; return; }
      try { const prep = await chiama('/api/whatsapp/prepara', { a, testo: ta.value }); vistaConferma(prep, () => vistaScrivi({ nome: campo ? a : nome, indietro, testo: ta.value })); } catch (e) { er.textContent = e.message; } }, 'ok'), er);
    mostra(...nodi); (campo || ta).focus(); }
  function vistaConferma(prep, modifica) { apri('Confermi l\'invio?', 'Il messaggio parte solo se premi "Invia".');
    const inv = btn('Invia', async () => { inv.disabled = true; inv.textContent = 'Invio…'; try { const d = await chiama('/api/whatsapp/invia', { pid: prep.pid }); apri('Fatto', ''); mostra(h('div', 'dett', d.messaggio), btn('Chiudi', chiudi)); }
      catch (e) { mostra(h('div', 'err', e.message), btn('← indietro', modifica, 'ind')); } }, 'ok'); inv.disabled = true; setTimeout(() => { inv.disabled = false; }, 1300);  // il tempo di leggere
    const nodi = [h('div', 'dett', 'Sto per mandare a ' + prep.nome + ':'), h('div', 'citaz', prep.testo)];
    if (!prep.in_rubrica) nodi.push(h('div', 'err', 'Questa persona non e\' in rubrica: per sicurezza non posso inviare. Salvala prima.'));
    const g = h('div', 'gruppo'); if (prep.in_rubrica) g.append(inv); g.append(btn('Modifica', modifica), btn('Annulla', chiudi, 'alt')); nodi.push(g); mostra(...nodi); }


  // ---- impara la mia voce ----
  const FRASI_VOCE = ['Ciao Jarvis, come stai oggi? Che programmi ho per questo pomeriggio?', 'Apri il programma dei negozi e fammi vedere come stanno andando le vendite.',
    'Scrivi a Marco che domani mattina passo in negozio alle dieci e mezza.', 'Controlla se ho nuove mail importanti e dimmi chi mi ha scritto su WhatsApp.',
    'Alza il volume della musica e metti su qualcosa di tranquillo.', 'Ricordami di chiamare il fornitore prima di pranzo e di controllare gli ordini.',
    'Quanto manca alla chiusura? Che tempo fara domani sera?', 'Hey Jarvis, dammi un quadro della giornata con agenda, posta e negozi.'];
  async function vistaVoce() { apri('Impara la mia voce', 'Resta vicino al microfono e parla con la voce di sempre. La tua impronta vocale resta solo su questo PC.'); attendi('Preparo il riconoscimento (la prima volta scarica un file da 26 MB: puo\' volerci un minuto)…');
    try { await chiama('/api/voce/prepara', {}); } catch (e) { return guasto(e); }
    let buone = 0, i = 0, occupato = false;
    const disegna = (msg, errore) => { const nodi = [];
      if (i >= FRASI_VOCE.length) nodi.push(h('div', 'dett', 'Hai letto tutte le frasi. Salva la tua voce, oppure registra ancora qualche frase.'));
      else { nodi.push(h('div', 'sezt', 'Frase ' + (i + 1) + ' di ' + FRASI_VOCE.length), h('div', 'citaz', FRASI_VOCE[i])); }
      nodi.push(h('div', 'dim', 'Registrazioni buone: ' + buone + (buone < 3 ? ' (ne servono almeno 3)' : '')));
      if (msg) nodi.push(h('div', errore ? 'err' : 'dett', msg));
      const g = h('div', 'gruppo');
      if (i < FRASI_VOCE.length) { const r = btn('● Registra (6 secondi)', async () => { if (occupato) return; occupato = true; let s = 6; r.disabled = true; r.textContent = 'Parla adesso… ' + s;
          const t = setInterval(() => { s = Math.max(0, s - 1); r.textContent = s ? 'Parla adesso… ' + s : 'Elaboro…'; }, 1000);
          try { const d = await chiama('/api/voce/registra', { secondi: 6 }); clearInterval(t); occupato = false; if (d.ok) { buone++; i++; disegna('Ottimo, registrata.'); } else disegna('Ho sentito poco (' + d.voce_s + ' secondi di voce): avvicinati al microfono, parla un po\' piu\' forte e riprova.', true); }
          catch (e) { clearInterval(t); occupato = false; disegna(e.message, true); } }, 'ok'); g.append(r); }
      if (buone >= 3) g.append(btn('Salva la mia voce', async () => { try { const d = await chiama('/api/voce/salva', {}); apri('Fatto', ''); mostra(h('div', 'dett', 'Ho imparato la tua voce (' + d.campioni + ' registrazioni). Da ora Jarvis risponde solo a te. Se un giorno non ti riconosce, nella finestra del microfono puoi abbassare la severita\' o aggiungere un\'altra registrazione.'), btn('Chiudi', chiudi)); } catch (e) { disegna(e.message, true); } }, buone >= 3 && i >= FRASI_VOCE.length ? 'ok' : ''));
      g.append(btn('Annulla', async () => { await chiama('/api/voce/annulla', {}).catch(() => {}); chiudi(); }, 'alt')); nodi.push(g); mostra(...nodi); };
    disegna(''); }
  window.jarvisApri = { impegni: vistaImpegni, whatsapp: vistaWhatsApp, voce: vistaVoce };
  $('#hud').addEventListener('click', e => { const a = e.target.closest('[data-apri]'); if (!a || !document.body.classList.contains('conbarra')) return; ({ impegni: vistaImpegni, whatsapp: vistaWhatsApp, 'whatsapp-app': () => chiama('/api/whatsapp/app', {}).catch(e => { apri('WhatsApp', ''); guasto(e); }) })[a.dataset.apri]?.(); });
  M.onclick = e => { if (e.target.id === 'int') chiudi(); }; addEventListener('keydown', e => { if (e.key === 'Escape') chiudi(); }); }

// avvisi dell'agente vigile: una scheda per ogni cosa che conta; cliccandola si apre la finestra giusta; sparisce da sola dopo un po'
{ const C = $('#avvisi'), mostrati = new Set(); const TAG = { impegno: 'impegno', posta: 'posta', whatsapp: 'whatsapp', banca: 'banca', treno: 'treno', negozi: 'negozi', domani: 'domani', promemoria: 'promemoria', obiettivi: 'obiettivi' };
  const chiudi = (id, el) => { el.remove(); api('/api/vigile/letto', { method: 'POST', body: JSON.stringify({ id }) }).catch(() => {}); };
  async function sonda() { if (document.hidden) return;
    try { const d = await (await api('/api/vigile')).json();
      for (const a of d.avvisi) { if (mostrati.has(a.id)) continue; mostrati.add(a.id);
        const el = document.createElement('div'); el.className = 'avviso' + (a.urgente ? ' urgente' : ''); const t = document.createElement('span'); t.className = 'tag'; t.textContent = TAG[a.tipo] || 'avviso';
        const m = document.createElement('span'); m.textContent = a.testo; if (a.anteprima) { const pv = document.createElement('div'); pv.className = 'prev'; pv.textContent = '\u201c' + a.anteprima + '\u201d'; m.append(pv); } const x = document.createElement('button'); x.className = 'x'; x.textContent = '×'; x.title = 'Chiudi';
        x.onclick = e => { e.stopPropagation(); chiudi(a.id, el); };
        el.onclick = () => { if (document.body.classList.contains('conbarra')) { if (a.tipo === 'impegno') window.jarvisApri?.impegni(); else if (a.tipo === 'whatsapp') window.jarvisApri?.whatsapp(); } chiudi(a.id, el); };
        el.append(t, m, x); C.append(el); while (C.children.length > 3) C.firstChild.remove(); setTimeout(() => { if (el.isConnected) chiudi(a.id, el); }, 60000); }
    } catch (e) {} }
  setTimeout(sonda, 4000); setInterval(sonda, 6000); }

// chiamata in attesa del si': scheda con i pulsanti (il clic vale come risposta, solo sul PC)
{ const C = $('#avvisi'); let corrente = '';
  async function sondaChiamata() { if (document.hidden || !document.body.classList.contains('conbarra')) return;
    try { const d = await (await api('/api/chiamata')).json(); const a = d.in_attesa; const el = document.getElementById('av-chiamata');
      if (!a) { if (el) el.remove(); corrente = ''; return; }
      if (el && corrente === a.id) return; if (el) el.remove(); corrente = a.id;
      const e = document.createElement('div'); e.id = 'av-chiamata'; e.className = 'avviso urgente'; const t = document.createElement('span'); t.className = 'tag'; t.textContent = 'chiamata';
      const m = document.createElement('span'); m.textContent = 'Chiamo ' + a.nome + '?';
      const bs = document.createElement('button'); bs.className = 'bt'; bs.textContent = 'S\u00ec, chiama'; const bn = document.createElement('button'); bn.className = 'bt'; bn.textContent = 'No';
      const manda = si => async ev => { ev.stopPropagation(); try { await api('/api/chiamata/conferma', { method: 'POST', body: JSON.stringify({ id: a.id, si }) }); } catch (x) {} e.remove(); corrente = ''; };
      bs.onclick = manda(true); bn.onclick = manda(false); e.append(t, m, bs, bn); C.append(e);
    } catch (e) {} }
  setInterval(sondaChiamata, 1500); }

// posizione per il meteo: la chiede il browser (con il tuo permesso) solo sul PC, ogni 3 ore; se la neghi si usa la citta' dall'indirizzo internet
{ const manda = () => { if (!document.body.classList.contains('conbarra') || !navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(p => api('/api/posizione', { method: 'POST', body: JSON.stringify({ lat: p.coords.latitude, lon: p.coords.longitude }) }).then(() => pannello()).catch(() => {}), () => {}, { maximumAge: 3600000, timeout: 15000 }); };
  setTimeout(manda, 5000); setInterval(manda, 3 * 3600 * 1000); }
// ricerca nel PC dalla barra: app, giochi, file, cartelle; se non trovi, chiedi a Jarvis (invio sull'ultima riga)
{ const q = $('#b-q'), R = $('#b-ris'); let voci = [], sel = 0, tim = 0, num = 0;
  const KIND = { app: 'app', file: 'file', cartella: 'cartella', jarvis: 'jarvis' };
  const chiudi = () => { R.classList.remove('on'); sel = 0; };
  const disegna = (nota) => { const t = q.value.trim(); if (!t) return chiudi();
    const tutte = [...voci, { tipo: 'jarvis', nome: 'Chiedi a Jarvis: ' + t, id: t }];
    R.replaceChildren(...tutte.map((v, i) => { const b = document.createElement('button'); if (i === sel) b.className = 'sel';
      b.innerHTML = `<span class="k">${KIND[v.tipo]}</span><span class="n"></span>` + (v.dove ? '<span class="d"></span>' : ''); b.querySelector('.n').textContent = v.nome; if (v.dove) b.querySelector('.d').textContent = v.dove;
      b.onmouseenter = () => { sel = i; R.querySelectorAll('button').forEach((x, k) => x.classList.toggle('sel', k === i)); }; b.onmousedown = e => { e.preventDefault(); scegli(v); }; return b; }),
      ...(nota ? [Object.assign(document.createElement('div'), { className: 'nota', textContent: nota })] : []));
    R.classList.add('on'); };
  function scegli(v) { chiudi(); if (v.tipo === 'jarvis') { q.value = ''; q.blur(); interrupted = false; lastUserText = v.id; submit(v.id, v.id); return; }
    api('/api/cerca/apri', { method: 'POST', body: JSON.stringify({ tipo: v.tipo, id: v.id }) }).then(() => { q.value = ''; q.blur(); }).catch(() => {}); }
  async function cerca() { const t = q.value.trim(); if (!t) return chiudi(); const mio = ++num;
    try { const d = await (await api('/api/cerca?q=' + encodeURIComponent(t))).json(); if (mio !== num) return; voci = d.voci || []; sel = 0; disegna(d.file_pronti ? '' : 'sto ancora leggendo i file del PC…'); } catch (e) {} }
  q.oninput = () => { clearTimeout(tim); tim = setTimeout(cerca, 150); };
  q.onfocus = () => { if (q.value.trim()) cerca(); };
  q.onblur = () => setTimeout(chiudi, 120);
  q.onkeydown = e => { const n = voci.length + 1;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : n - 1)) % n; disegna(); }
    else if (e.key === 'Enter') { e.preventDefault(); const t = q.value.trim(); if (!t) return; scegli(sel < voci.length ? voci[sel] : { tipo: 'jarvis', id: t }); }
    else if (e.key === 'Escape') { q.value = ''; chiudi(); q.blur(); } };
  addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && document.body.classList.contains('conbarra')) { e.preventDefault(); q.focus(); q.select(); } }); }

// barra in basso: compare solo sul PC Windows (dal telefono no). App del Desktop, finestre aperte, Start, uscita dal tutto schermo.
{ const B = $('#barra'); let ultimaFirma = '';
  const orologioBarra = () => { const d = new Date(); $('#b-h').textContent = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    $('#b-d').textContent = d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }); };
  orologioBarra(); setInterval(orologioBarra, 1000);
  const post = (a, corpo) => api('/api/barra/' + a, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo || {}) }).catch(() => {});
  const tasto = (cls, tip, icona, nome, onclick) => { const b = document.createElement('button'); b.className = 'vb ' + cls; b.dataset.tip = tip;
    if (icona) { const i = document.createElement('img'); i.src = icona; i.alt = ''; b.append(i); } else { const l = document.createElement('span'); l.className = 'let'; l.textContent = (nome || '?').slice(0, 2).toUpperCase(); b.append(l); }
    b.onclick = onclick; return b; };
  async function aggiornaBarra() {
    if (document.hidden) return;
    try { const r = await api('/api/barra'); if (!r.ok) return; const d = await r.json();
      document.body.classList.toggle('conbarra', !!d.attiva); if (!d.attiva) return; $('#b-win').style.display = d.shell_jarvis ? '' : 'none';
      const firma = JSON.stringify([d.finestre.map(f => [f.id, f.attiva, f.ridotta, !!f.icona, f.titolo])]);
      if (firma === ultimaFirma) return; ultimaFirma = firma;
      $('#b-fin').replaceChildren(...d.finestre.map(f => tasto('aperta' + (f.attiva ? ' attiva' : '') + (f.ridotta ? ' ridotta' : ''), f.titolo || f.nome, f.icona, f.nome, () => { post('porta', { id: f.id }); setTimeout(aggiornaBarra, 400); })));
    } catch (e) {}
  }
  $('#b-start').onclick = () => post('start');
  $('#b-win').onclick = () => post('windows');
  $('#b-esci').onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} post('schermo'); };
  aggiornaBarra(); setInterval(aggiornaBarra, 2500); document.addEventListener('visibilitychange', aggiornaBarra); }
