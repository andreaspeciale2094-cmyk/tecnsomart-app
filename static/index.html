<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="theme-color" content="#04050a">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#04050a; --panel:#0c0d14; --red:#ff2a3d; --red2:#b3121f; --red-dim:#5a0f18; --gold:#ffb454; --dim:#8b8f9c; --text:#ecedf2; --line:#2a1519; }
  * { box-sizing: border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column; color:var(--text); overflow:hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 80% 55% at 50% -10%, rgba(255,42,61,.18), transparent 70%),
      linear-gradient(rgba(255,42,61,.035) 1px, transparent 1px) 0 0/44px 44px,
      linear-gradient(90deg, rgba(255,42,61,.035) 1px, transparent 1px) 0 0/44px 44px,
      var(--bg); }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:20;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); opacity:.35; }
  body.calmo::after { display:none; }
  header { display:flex; align-items:center; gap:16px; padding:14px 18px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(255,42,61,.07), transparent); position:relative; }
  header::after { content:""; position:absolute; left:0; bottom:-1px; width:180px; height:2px; background:linear-gradient(90deg, var(--red), transparent); }
  /* sfera: anelli che cambiano con lo stato (pronto, ti ascolto, sto pensando, parla) */
  #orb { position:relative; width:46px; height:46px; border-radius:50%; flex:none; margin:8px 22px 8px 20px;
    background:radial-gradient(circle at 50% 45%, #fff 0, #ff7a86 18%, var(--red) 40%, var(--red2) 68%, #3a0a10 100%);
    box-shadow:0 0 22px rgba(255,42,61,.8), 0 0 60px rgba(255,42,61,.35); transition:box-shadow .3s; }
  #orb::before, #orb::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(255,42,61,.55); pointer-events:none; }
  #orb::before { inset:-9px; border-style:dashed; animation:gira 14s linear infinite; }
  #orb::after { inset:-17px; border-color:rgba(255,42,61,.22); animation:gira 24s linear infinite reverse; }
  #orb.listening { background:radial-gradient(circle at 50% 45%, #fff 0, #ffe1a8 18%, var(--gold) 40%, #b36a12 70%, #3a2305 100%);
    box-shadow:0 0 26px rgba(255,180,84,.85), 0 0 70px rgba(255,180,84,.35); animation:respira 1.6s ease-in-out infinite; }
  #orb.listening::before, #orb.listening::after { border-color:rgba(255,180,84,.6); }
  #orb.thinking { animation:respira .9s ease-in-out infinite; }
  #orb.thinking::before { animation-duration:2.2s; border-style:solid; border-color:var(--red); border-top-color:transparent; border-bottom-color:transparent; }
  #orb.speaking { animation:parla .5s ease-in-out infinite; }
  @keyframes gira { to { transform:rotate(360deg); } }
  @keyframes respira { 50% { transform:scale(1.14); } }
  @keyframes parla { 50% { transform:scale(1.08); box-shadow:0 0 34px rgba(255,42,61,1), 0 0 90px rgba(255,42,61,.5); } }
  body.calmo #orb, body.calmo #orb::before, body.calmo #orb::after { animation:none !important; }
  h1 { font-size:15px; letter-spacing:.5em; margin:0; font-weight:600; color:#fff; text-shadow:0 0 14px rgba(255,42,61,.6); }
  #status { color:var(--red); font-size:11px; letter-spacing:.18em; text-transform:uppercase; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; margin-top:3px; }
  #asc { font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-family:ui-monospace, Consolas, monospace; margin-top:3px; color:var(--dim); }
  #asc.ok { color:var(--gold); } #asc.no { color:#ff8a8a; }
  .spacer { flex:1; }
  header button { background:rgba(255,42,61,.04); border:1px solid var(--red-dim); color:var(--dim); border-radius:4px; padding:7px 11px; cursor:pointer; font-size:11px;
    letter-spacing:.06em; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; text-transform:uppercase; transition:.2s;
    clip-path:polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
  header button:hover { color:#fff; border-color:var(--red); background:rgba(255,42,61,.12); }
  header button.on { color:#fff; border-color:var(--red); background:rgba(255,42,61,.18); box-shadow:0 0 12px rgba(255,42,61,.35) inset; }
  #visore { display:none; flex:0 0 42%; min-height:180px; position:relative; border-bottom:1px solid var(--line);
    background:radial-gradient(ellipse 60% 80% at 50% 50%, rgba(255,42,61,.07), transparent 70%); }
  body.conrete #visore { display:block; }
  /* modo voce (predefinito): la rete riempie la finestra, niente chat scritta; i sottotitoli mostrano cosa dice Jarvis */
  body.solovoce #visore { display:block; flex:1 1 auto; border-bottom:0; }
  body.solovoce #log, body.solovoce #f { display:none; }
  /* riquadri informativi sulla rete: ora, impegni, posta, WhatsApp (il pulsante privacy li nasconde) */
  #hud { position:absolute; inset:0; pointer-events:none; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; text-transform:uppercase; letter-spacing:.14em; }
  body.privacy #hud { display:none; }
  .box { position:absolute; padding:10px 14px; border-left:2px solid var(--red); background:linear-gradient(90deg, rgba(255,42,61,.10), transparent); font-size:11px; color:var(--dim); line-height:1.7; max-width:44%; }
  .box b { color:#fff; font-weight:600; font-size:15px; letter-spacing:.06em; }
  .box .t { color:var(--red); font-size:10px; display:block; }
  #hud-sx, #hud-bs { display:none; }
  #hud-sx { left:3%; top:5%; } #hud-dx { right:3%; top:5%; text-align:right; border-left:0; border-right:2px solid var(--red); background:linear-gradient(270deg, rgba(255,42,61,.10), transparent); }
  #hud-bs { left:3%; bottom:5%; }
  #ora { font-size:clamp(26px,4vw,52px); color:#fff; letter-spacing:.08em; text-shadow:0 0 18px rgba(255,42,61,.6); font-weight:300; }
  body:not(.solovoce) #hud { display:none; }
  #didascalia { position:absolute; left:50%; bottom:4%; transform:translateX(-50%); width:min(820px,90%); text-align:center; pointer-events:none;
    font-size:clamp(15px,2.2vw,22px); line-height:1.45; color:#fff; text-shadow:0 0 18px rgba(255,42,61,.9), 0 2px 6px #000; max-height:30%; overflow:hidden; }
  #didascalia .tu { display:block; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--red); margin-bottom:6px; font-family:ui-monospace, Consolas, monospace; }
  #didascalia:empty { display:none; }
  #rete { position:absolute; inset:0; width:100%; height:100%; }
  #log { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; scrollbar-color:var(--red-dim) transparent; }
  .msg { max-width:min(740px,88%); padding:11px 16px; line-height:1.5; white-space:pre-wrap; animation:entra .25s ease-out;
    clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
  body.calmo .msg { animation:none; }
  @keyframes entra { from { opacity:0; transform:translateY(6px); } }
  .user { align-self:flex-end; background:linear-gradient(135deg, #3a0f15, #1c0a0e); border-right:2px solid var(--red); }
  .jarvis { align-self:flex-start; background:linear-gradient(135deg, rgba(255,255,255,.055), rgba(255,255,255,.015)); border-left:2px solid var(--gold); }
  .tools { font-size:10.5px; color:var(--dim); margin-top:7px; font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing:.04em; }
  form { display:flex; gap:10px; padding:14px 18px 20px; border-top:1px solid var(--line); background:linear-gradient(0deg, rgba(255,42,61,.06), transparent); }
  input { flex:1; min-width:0; background:rgba(12,13,20,.9); border:1px solid var(--red-dim); color:var(--text); padding:13px 16px; font-size:16px; outline:none; border-radius:2px;
    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition:.2s; }
  input:focus { border-color:var(--red); box-shadow:0 0 18px rgba(255,42,61,.25); }
  input::placeholder { color:#5d606c; }
  form button { flex:none; background:linear-gradient(135deg, var(--red), var(--red2)); color:#fff; border:0; padding:0 22px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; cursor:pointer; font-size:12px;
    clip-path:polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); transition:.2s; }
  form button:hover { filter:brightness(1.2); box-shadow:0 0 18px rgba(255,42,61,.6); }
  #mic { background:#2a0d12; color:var(--red); border:1px solid var(--red-dim); padding:0 16px; }
  #mic.on { background:var(--gold); color:#2a1700; animation:respira 1.2s infinite; }
  body.calmo #mic.on { animation:none; }
  #login { position:fixed; inset:0; background:rgba(4,5,10,.97); display:none; align-items:center; justify-content:center; z-index:30; }
  #login form { flex-direction:column; width:min(320px,86%); padding:0; border:0; background:none; }
  #login h2 { letter-spacing:.45em; font-size:16px; text-align:center; color:#fff; text-shadow:0 0 16px rgba(255,42,61,.8); }
  #err { color:#ff8a8a; font-size:13px; min-height:1em; text-align:center; }
  .inbox { border-left-color:var(--red); }
  @media (max-width:640px) { #visore { flex-basis:34%; min-height:150px; } header { flex-wrap:wrap; gap:8px; padding:8px 10px; } #orb { margin:8px 16px 8px 14px; } form { padding:12px 12px 16px; } form button { padding:0 14px; } h1 { letter-spacing:.3em; } .spacer { display:none; } header button { padding:6px 8px; } }
</style>
</head>
<body>
<div id="login"><form id="lf"><h2>J.A.R.V.I.S.</h2><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button>Accedi</button><div id="err"></div></form></div>
<header>
  <div id="orb"></div>
  <div><h1>J.A.R.V.I.S.</h1><div id="status">pronto</div><div id="asc" title="Stato vero dell'ascolto in stanza"></div></div>
  <div class="spacer"></div>
  <button id="stopbtn" title="Ferma la voce (anche: di' stop)">⏹ stop</button>
  <button id="tts" class="on" title="Risposte vocali">🔊 voce</button>
  <button id="bell" title="Notifiche">📬 <span id="nb">0</span></button>
  <button id="wake" title="Ascolto continuo: di' 'Jarvis ...'">👂 sempre in ascolto</button>
  <button id="priv" title="Nasconde i riquadri con impegni, posta e messaggi (se qualcuno guarda lo schermo)">🙈 privacy</button>
  <button id="chatbtn" title="Mostra o nasconde la chat scritta">💬 chat</button>
  <button id="vis" title="Mostra o nasconde la rete neurale (con la chat aperta)">🧠 rete</button>
  <button id="fx" title="Meno animazioni (per PC lenti)">✨ effetti</button>
</header>
<div id="visore"><canvas id="rete"></canvas>
  <div id="hud"><div class="box" id="hud-sx"></div><div class="box" id="hud-dx"><div id="ora"></div><div id="data"></div></div><div class="box" id="hud-bs"></div></div>
  <div id="didascalia"></div></div>
<div id="log"></div>
<form id="f">
  <button type="button" id="mic" title="Parla">🎤</button>
  <input id="q" placeholder="Scrivi o parla…" autocomplete="off" autofocus>
  <button>Invia</button>
</form>
<script>
const $ = s => document.querySelector(s);
const log = $('#log'), orb = $('#orb'), status = $('#status');
const session = localStorage.jarvisSession ||= crypto.randomUUID();
let ttsOn = true, wakeOn = false, busy = false, cfg = { tts:false, stt:false };
let audioEl = null;

function add(text, cls, tools) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  if (tools?.length) { const t = document.createElement('div'); t.className = 'tools'; t.textContent = '⚙ ' + tools.join(' · '); d.append(t); }
  log.append(d); log.scrollTop = log.scrollHeight; return d;
}
// Analizzatore del suono: la rete neurale si muove a ritmo della voce. Si collega a una voce solo se l'audio e' gia' sbloccato dal browser
// (altrimenti la voce suonerebbe muta): in quel caso la rete simula il ritmo.
// Dice al server cosa sta facendo la pagina, per lo sfondo animato del PC (solo etichette, mai testi)
{ let ultima = '', ultimoInvio = 0; const NOMI = { listening: 'ti ascolto', thinking: 'capisco', speaking: 'rispondo' };
  const invia = () => { const c = ['speaking', 'thinking', 'listening'].find(k => orb.classList.contains(k)); const f = NOMI[c] || '';
    if (f === ultima && (!f || performance.now() - ultimoInvio < 2000)) return; ultima = f; ultimoInvio = performance.now();
    fetch('/api/fase', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fase: f }), credentials: 'same-origin' }).catch(() => {}); };
  setInterval(invia, 500); }
let actx = null, hooked = new WeakSet();
function unlockAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const an = actx.createAnalyser(); an.fftSize = 256; an.smoothingTimeConstant = 0.78; an.connect(actx.destination); window.JarvisAnalyser = an;
      actx.onstatechange = () => { if (actx.state !== 'running') actx.resume().catch(() => {}); };
    }
    if (actx.state !== 'running') actx.resume().catch(() => {});
  } catch (e) {}
}
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, unlockAudio));
function hookAudio(el) {
  try { if (!actx || actx.state !== 'running' || hooked.has(el)) return; actx.createMediaElementSource(el).connect(window.JarvisAnalyser); hooked.add(el); } catch (e) {}
}
function setState(s, label) { orb.className = s; status.textContent = label; }
// La sfera "parla" mentre Jarvis legge una risposta; gli effetti si possono ridurre (ricordato dal browser)
setInterval(() => orb.classList.toggle('speaking', speaking() && !orb.classList.contains('thinking') && !orb.classList.contains('listening')), 200);
{ let rete = true; try { rete = localStorage.jarvisRete !== '0'; } catch (e) {} document.body.classList.toggle('conrete', rete); $('#vis').classList.toggle('on', rete);
  $('#vis').onclick = e => { const r = document.body.classList.toggle('conrete'); e.currentTarget.classList.toggle('on', r); try { localStorage.jarvisRete = r ? '1' : '0'; } catch (er) {} }; }
{ let pv = false; try { pv = localStorage.jarvisPrivacy === '1'; } catch (e) {} document.body.classList.toggle('privacy', pv); $('#priv').classList.toggle('on', pv);
  $('#priv').onclick = e => { const p = document.body.classList.toggle('privacy'); e.currentTarget.classList.toggle('on', p); try { localStorage.jarvisPrivacy = p ? '1' : '0'; } catch (er) {} };
  // riquadri: orologio ogni secondo, dati (impegni, posta, WhatsApp) ogni minuto
  const orologio = () => { const d = new Date(); $('#ora').textContent = d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    $('#data').textContent = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }); };
  orologio(); setInterval(orologio, 1000);
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function pannello() { try { const p = await (await api('/api/pannello')).json(); let sx = '', bs = '';
    if (p.agenda) sx = `<span class="t">oggi</span><b>${p.agenda.n}</b> impegni` + (p.agenda.prossimo ? `<br>prossimo: <b>${esc(p.agenda.prossimo.ora)}</b> ${esc(p.agenda.prossimo.titolo)}` : '<br>nient\'altro per oggi');
    if (p.mail) bs += `<span class="t">posta</span>` + Object.entries(p.mail).map(([k, n]) => `${esc(k)}: <b>${n}</b>`).join(' · ');
    if (p.whatsapp) bs += (bs ? '<br>' : '') + `<span class="t">whatsapp</span><b>${p.whatsapp.messaggi}</b> messaggi da ${p.whatsapp.chat} chat`;
    $('#hud-sx').style.display = sx ? 'block' : 'none'; $('#hud-sx').innerHTML = sx; $('#hud-bs').style.display = bs ? 'block' : 'none'; $('#hud-bs').innerHTML = bs; } catch (e) {} }
  setTimeout(pannello, 2500); setInterval(pannello, 60000); }
{ let sv = true; try { sv = localStorage.jarvisChat !== '1'; } catch (e) {} document.body.classList.toggle('solovoce', sv); $('#chatbtn').classList.toggle('on', !sv);
  const mostraChat = on => { document.body.classList.toggle('solovoce', !on); $('#chatbtn').classList.toggle('on', on); try { localStorage.jarvisChat = on ? '1' : '0'; } catch (er) {} if (on) { log.scrollTop = log.scrollHeight; $('#q').focus(); } };
  $('#chatbtn').onclick = () => mostraChat(document.body.classList.contains('solovoce'));
  // scrivendo sulla tastiera si apre la chat (il pulsante chat la richiude)
  addEventListener('keydown', e => { if ($('#login').style.display === 'flex') return; if (document.body.classList.contains('solovoce') && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) mostraChat(true); });
  // sottotitoli: l'ultima risposta di Jarvis (e cosa hai detto) sopra la rete
  const did = $('#didascalia');
  new MutationObserver(() => {
    const m = [...log.querySelectorAll('.msg')]; const j = [...m].reverse().find(x => x.classList.contains('jarvis')); const u = [...m].reverse().find(x => x.classList.contains('user'));
    if (!j && !u) return;
    const testo = el => { const c = el.cloneNode(true); c.querySelectorAll('.tools').forEach(t => t.remove()); return c.textContent.trim(); };
    const ultimo = m[m.length - 1], mio = ultimo && ultimo.classList.contains('user');
    did.textContent = ''; const t = document.createElement('span'); t.className = 'tu'; t.textContent = mio ? 'tu' : 'jarvis'; did.append(t);
    const txt = testo(mio ? u : j); did.append(txt.length > 420 ? '…' + txt.slice(-420) : txt);
  }).observe(log, { childList: true, subtree: true, characterData: true });
}
{ let calmo = false; try { calmo = localStorage.jarvisCalmo === '1'; } catch (e) {} document.body.classList.toggle('calmo', calmo); $('#fx').classList.toggle('on', !calmo);
  $('#fx').onclick = e => { const c = document.body.classList.toggle('calmo'); e.currentTarget.classList.toggle('on', !c); try { localStorage.jarvisCalmo = c ? '1' : '0'; } catch (er) {} }; }

async function api(path, opts = {}) {
  const r = await fetch(path, { credentials:'same-origin', ...opts, headers:{ 'Content-Type':'application/json', ...(opts.headers||{}) } });
  if (r.status === 401) { showLogin(); throw new Error('login richiesto'); }
  if (!r.ok) throw new Error((await r.text()).slice(0, 200));
  return r;
}

// ---- Login ----
function showLogin() { $('#login').style.display = 'flex'; $('#pw').focus(); }
$('#lf').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: $('#pw').value }) });
  if (r.ok) { $('#login').style.display = 'none'; $('#pw').value = ''; $('#err').textContent = ''; init(); } else $('#err').textContent = 'Password errata o troppi tentativi';
};

// ---- Voce in uscita: voce neurale del server se configurata, altrimenti quella del browser ----
let lastUserText = '', interrupted = false, pendingText = null;
function afterSpeech() { if (wakeOn) startRec(); }

// ---- Voce in uscita a frasi: la prima parte appena e' pronta, le altre si preparano mentre parla ----
let speakToken = 0, speakingNow = false, queue = [], wake = null, streamDone = true, firstAudioCb = null;
// Frasi fisse ("Un attimo, signore."): partono subito se la risposta tarda, cosi' non c'e' mai silenzio
let fixedAudio = {}, fillerEl = null, fillerDone = Promise.resolve(), fillerEnd = null, lastFiller = '', audioActive = false, lastActivity = 0;
const STATUS = { web_search: 'stato_cerca', code_execution: 'stato_cerca', bash_code_execution: 'stato_cerca', web_fetch: 'stato_pagina', fetch_url: 'stato_pagina', remember: 'stato_memoria', recall: 'stato_memoria', forget: 'stato_memoria' };
const note = (tag, detail = '') => { try { fetch('/api/note', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tag, detail }) }).catch(() => {}); } catch (e) {} };
let sendStart = 0, loadTries = 0;
async function loadFillers() {
  let total = 0;
  try {
    const { phrases } = await (await api('/api/fixed')).json(); total = phrases.length;
    for (const k of phrases) { if (fixedAudio[k]) continue; try { fixedAudio[k] = URL.createObjectURL(await (await api('/api/fixed/' + k)).blob()); } catch (e) {} }
  } catch (e) {}
  const n = Object.keys(fixedAudio).length;
  if (n < total && loadTries++ < 8) setTimeout(loadFillers, 5000);  // alcune non erano ancora pronte: riprova
  else note('frasi', `${n} di ${total} caricate`);
}
function playFixed(key, token) {
  if (!ttsOn || token !== speakToken || queue.length || audioActive) return false;
  if (!fixedAudio[key]) { note('stato_mancante', key); return false; }
  note(key.startsWith('attesa') ? 'fissa' : 'stato', `${key} dopo ${((performance.now() - sendStart) / 1000).toFixed(1)} s`);
  audioActive = true; lastActivity = performance.now();
  fillerDone = new Promise(res => { fillerEnd = res; });
  fillerEl = new Audio(fixedAudio[key]); hookAudio(fillerEl);
  fillerEl.onended = fillerEl.onerror = () => { audioActive = false; lastActivity = performance.now(); fillerEnd?.(); };
  fillerEl.play().catch(() => { audioActive = false; fillerEnd?.(); });
  return true;
}
function playFiller(token) {
  const keys = Object.keys(fixedAudio).filter(k => k.startsWith('attesa'));
  if (!keys.length) return;
  let k; do { k = keys[Math.floor(Math.random() * keys.length)]; } while (keys.length > 1 && k === lastFiller);
  if (playFixed(k, token)) lastFiller = k;
}
const speaking = () => speakingNow || speechSynthesis.speaking;
const stopSpeaking = () => { speakToken++; queue = []; speakingNow = false; audioEl?.pause(); fillerEl?.pause(); audioActive = false; fillerEnd?.(); speechSynthesis.cancel(); wake?.(); };

function beginSpeech() { stopSpeaking(); streamDone = false; const t = speakToken; runQueue(t); return t; }
function endSpeech() { streamDone = true; wake?.(); }
function enqueue(text, token) {
  if (!ttsOn || token !== speakToken || !text.trim()) return;
  const clean = text.replace(/[*_`#]/g, '');
  if (!/[\p{L}\p{N}]/u.test(clean)) return;   // solo simboli: niente da leggere
  const p = cfg.tts ? api('/api/tts', { method:'POST', body: JSON.stringify({ text: clean }) }).then(r => r.blob()) : null;
  p?.catch(() => {});
  queue.push({ text: clean, p }); wake?.();
}
async function runQueue(token) {
  speakingNow = true;
  while (token === speakToken) {
    if (!queue.length) {
      if (streamDone) break;
      await new Promise(r => wake = r); wake = null; continue;
    }
    const item = queue.shift();
    await fillerDone; if (token !== speakToken) return;
    let played = false, blocked = false;
    if (item.p) {
      try {
        const blob = await item.p; if (token !== speakToken) return;
        await new Promise(res => { audioEl = new Audio(URL.createObjectURL(blob)); hookAudio(audioEl);
          audioEl.onended = audioEl.onerror = () => { audioActive = false; lastActivity = performance.now(); res(); };
          audioEl.onplaying = () => { audioActive = true; firstAudioCb?.(); firstAudioCb = null; };
          audioEl.play().catch(e => { blocked = true; res(); }); });
        played = !blocked;
      } catch (e) { /* ripiega sulla voce del browser per questa frase */ }
    }
    if (blocked) setState('', 'audio bloccato dal browser: clicca una volta sulla pagina e riprova');
    if (!played && token === speakToken && 'speechSynthesis' in window) {
      await new Promise(res => { const u = new SpeechSynthesisUtterance(item.text); u.lang = 'it-IT';
        const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('it')); if (v) u.voice = v;
        u.onstart = () => { audioActive = true; firstAudioCb?.(); firstAudioCb = null; }; u.onend = u.onerror = () => { audioActive = false; lastActivity = performance.now(); res(); }; speechSynthesis.speak(u); });
    }
  }
  if (token === speakToken) { speakingNow = false; afterSpeech(); }
}

// Estrae le frasi complete dal testo che arriva a pezzi (min. 12 caratteri, tranne l'ultima)
function takeSentences(buf, final) {
  const out = []; let rest = buf, m;
  const re = /^([\s\S]{12,}?[.!?…]+)(\s+|$)/;
  while ((m = re.exec(rest)) && (m[2] || final)) { out.push(m[1].trim()); rest = rest.slice(m[0].length); }
  if (final && rest.trim()) { out.push(rest.trim()); rest = ''; }
  return [out, rest];
}

async function send(text, label) {
  if (!text.trim() || busy) return;
  stopSpeaking();
  busy = true; add(label || text, 'user'); setState('thinking', 'sto pensando…');
  const bubble = add('', 'jarvis'), t0 = performance.now();
  const token = beginSpeech(); let buf = '', shown = '', tools = [], timeNote = '';
  let toolKey = 'stato_ancora', ended = false; lastActivity = sendStart = performance.now();
  const fillerTimer = setTimeout(() => { if (!shown) playFiller(token); }, 700);
  // Mai silenzio: se per 3 secondi non si sente niente, dice cosa sta facendo (ripete ogni 3 s di silenzio)
  const silenceTimer = setInterval(() => {
    if (ended || token !== speakToken || audioActive || queue.length) return;
    if (performance.now() - lastActivity >= 3000) { if (!playFixed(toolKey, token)) lastActivity = performance.now(); toolKey = 'stato_ancora'; }
  }, 500);
  firstAudioCb = () => { timeNote = `prima parola dopo ${((performance.now() - t0) / 1000).toFixed(1)} s`; render(); };
  const render = () => { bubble.textContent = shown; if (tools.length || timeNote) { const t = document.createElement('div'); t.className = 'tools'; t.textContent = '⚙ ' + [...tools, timeNote].filter(Boolean).join(' · '); bubble.append(t); } log.scrollTop = log.scrollHeight; };
  try {
    const r = await api('/api/chat_stream', { method:'POST', body: JSON.stringify({ session, message: text }) });
    const reader = r.body.getReader(), dec = new TextDecoder(); let line = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      line += dec.decode(value, { stream: true });
      let i; while ((i = line.indexOf('\n')) >= 0) {
        const raw = line.slice(0, i); line = line.slice(i + 1); if (!raw.trim()) continue;
        const ev = JSON.parse(raw);
        if (ev.type === 'text') {
          clearTimeout(fillerTimer); lastActivity = performance.now(); shown += ev.delta; buf += ev.delta; render();
          const [sent, rest] = takeSentences(buf, false); buf = rest; sent.forEach(x => enqueue(x, token));
        } else if (ev.type === 'tool') { tools.push(ev.name); if (STATUS[ev.name]) toolKey = STATUS[ev.name]; render();
        } else if (ev.type === 'done') { tools = ev.tools.length ? ev.tools : tools; render();
        } else if (ev.type === 'error') { shown = ev.message; buf = ev.message; render(); }
      }
    }
    const [sent] = takeSentences(buf, true); sent.forEach(x => enqueue(x, token));
  } catch (e) { shown = 'Errore: ' + e.message; render(); }
  ended = true; clearInterval(silenceTimer); clearTimeout(fillerTimer); endSpeech(); render();
  busy = false; setState('', wakeOn ? 'in ascolto…' : 'pronto');
  if (pendingText) { const p = pendingText; pendingText = null; send(p.full, p.label); }  // richiesta fatta mentre rispondeva
}
$('#f').onsubmit = e => { e.preventDefault(); const v = $('#q').value.trim(); $('#q').value = ''; if (!v) return; interrupted = false; lastUserText = v; submit(v, v); };
$('#stopbtn').onclick = () => { stopSpeaking(); interrupted = false; pendingText = null; };
addEventListener('keydown', e => { if (e.key === 'Escape') $('#stopbtn').onclick(); });
$('#tts').onclick = e => { ttsOn = !ttsOn; e.target.classList.toggle('on', ttsOn); if (!ttsOn) stopSpeaking(); };

// ---- Voce in ingresso ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recActive = false;
const STOP_RE = /^(?:(?:ehi |hey |ok )?jarvis[,.!]?\s*)?(stop|basta|fermo|fermati|zitto)[.!]?$/i;   // ferma e annulla
const WAIT_RE = /^(?:(?:ehi |hey |ok )?jarvis[,.!]?\s*)?(aspetta|un attimo|un momento|aspetta un attimo)[.!]?$/i;  // ferma e aspetta l'aggiunta
const WAKE_RE = /^(ehi |hey |ok )?jarvis[,.!]?\s*(.*)$/i;
function submit(full, label) { if (busy) { pendingText = { full, label }; return; } send(full, label); }

// Un frase ascoltata: comandi di stop, aggiunta alla richiesta di prima, oppure richiesta nuova
function handleHeard(t, overSpeech) {
  t = t.trim(); if (!t) return;
  if (wakeOn && !overSpeech && !interrupted) { const m = t.match(WAKE_RE); if (!m || !m[2]) return; t = m[2].trim(); }
  if (STOP_RE.test(t)) { stopSpeaking(); interrupted = false; pendingText = null; return; }
  if (WAIT_RE.test(t)) { stopSpeaking(); interrupted = !!lastUserText; return; }
  if (interrupted && lastUserText) {
    const full = `Richiesta di prima: «${lastUserText}». Mi sono interrotto per aggiungere: «${t}». Rianalizza tutto e rispondi.`;
    lastUserText = `${lastUserText} ${t}`; interrupted = false; submit(full, t); return;
  }
  lastUserText = t; submit(t, t);
}

function startRec() {
  if (!SR || recActive || (!wakeOn && (busy || speaking()))) return;   // in ascolto continuo ascolta anche mentre Jarvis parla
  rec = new SR(); rec.lang = 'it-IT'; rec.interimResults = true;
  let over = false;
  rec.onstart = () => { recActive = true; $('#mic').classList.add('on'); if (!busy) setState('listening', 'ti ascolto…'); };
  rec.onend = () => { recActive = false; $('#mic').classList.remove('on'); if (wakeOn) setTimeout(startRec, 300); else if (!busy) setState('', 'pronto'); };
  rec.onresult = ev => {
    const r = ev.results[ev.results.length - 1], t = r[0].transcript.trim();
    if (!r.isFinal) {  // sta parlando sopra la voce di Jarvis: si ferma subito
      if (!over && speaking() && t.length >= 4) { over = true; stopSpeaking(); interrupted = !!lastUserText; }
      return;
    }
    handleHeard(t, over); over = false;
  };
  rec.onerror = () => {}; rec.start();
}

// Push-to-talk con Whisper (piu' preciso) quando disponibile
let mr = null, chunks = [];
async function whisperToggle() {
  if (mr?.state === 'recording') { mr.stop(); return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  mr = new MediaRecorder(stream); chunks = [];
  mr.ondataavailable = e => chunks.push(e.data);
  mr.onstart = () => { $('#mic').classList.add('on'); setState('listening', 'ti ascolto… (premi ancora per inviare)'); };
  mr.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); $('#mic').classList.remove('on'); setState('thinking', 'trascrivo…');
    try {
      const blob = new Blob(chunks, { type: mr.mimeType });
      const r = await api('/api/stt', { method:'POST', headers:{ 'Content-Type': mr.mimeType }, body: blob });
      const { text } = await r.json(); setState('', 'pronto'); handleHeard(text, false);
    } catch (e) { add('Errore: ' + e.message, 'jarvis'); setState('', 'pronto'); }
  };
  mr.start();
}
$('#mic').onclick = () => {
  if (cfg.stt && navigator.mediaDevices) return whisperToggle();
  if (!SR) return alert('Riconoscimento vocale non supportato: usa Chrome o Edge.');
  recActive ? rec.stop() : startRec();
};
$('#wake').onclick = e => { if (cfg.ascolto_stanza) return alert("L'ascolto in stanza e' gia' attivo in sottofondo (anche a pagina chiusa): dici 'Hey Jarvis' e risponde. Questo pulsante non serve, e usarlo insieme farebbe rispondere Jarvis due volte."); if (!SR) return alert('Usa Chrome o Edge.'); wakeOn = !wakeOn; e.target.classList.toggle('on', wakeOn); wakeOn ? startRec() : rec?.stop(); };

// ---- Notifiche proattive (briefing, agenti in background, promemoria) ----
async function pollInbox() {
  try {
    const items = await (await api('/api/inbox')).json();
    $('#nb').textContent = items.length;
    if (!items.length || busy) return;
    for (const it of items.reverse()) {
      const d = add(`📬 ${it.title}\n${it.body}`, 'jarvis inbox');
      if (document.hidden && Notification.permission === 'granted') new Notification(it.title, { body: it.body.slice(0, 160) });
    }
    { const t = beginSpeech(); enqueue(items.map(i => i.body).join(' '), t); endSpeech(); }
    await api('/api/inbox/read', { method:'POST', body: JSON.stringify({ ids: items.map(i => i.id) }) });
    $('#nb').textContent = 0;
  } catch (e) {}
}
$('#bell').onclick = () => { Notification?.requestPermission?.(); pollInbox(); };

let started = false;
async function init() {
  if (started) return; started = true;
  try { cfg = await (await api('/api/config')).json(); } catch (e) { started = false; return; }
  if (cfg.stt) $('#mic').title = 'Premi per parlare, premi ancora per inviare (Whisper)';
  { const h = new Date().getHours(); add(`${h >= 5 && h < 18 ? 'Buongiorno' : 'Buonasera'}${cfg.user ? ', ' + cfg.user : ''}. Tutti i sistemi sono operativi. Come posso esserle utile?`, 'jarvis'); }
  loadFillers(); pollInbox(); setInterval(pollInbox, 15000);
  if (cfg.ascolto_stanza) { $('#wake').textContent = '👂 ascolto in stanza'; const asc = $('#asc');
    const aggiorna = async () => { try { const a = await (await api('/api/ascolto')).json();
      if (a.errore) { asc.textContent = 'ascolto: problema (' + a.errore + ')'; asc.className = 'no'; }
      else if (!a.attivo) { asc.textContent = 'ascolto: spento'; asc.className = 'no'; }
      else if (a.in_ascolto) { asc.textContent = a.stt ? 'ascolto in stanza: ' + (a.fase || 'acceso') : 'ascolto acceso, manca il riconoscimento vocale'; asc.className = a.stt ? 'ok' : 'no'; }
      else { asc.textContent = 'ascolto: sto avviando…'; asc.className = ''; } } catch (e) {} };
    aggiorna(); setInterval(aggiorna, 1500); }
}
speechSynthesis?.getVoices();
(async () => { const a = await (await fetch('/api/auth')).json(); a.required && !a.ok ? showLogin() : init(); })();
</script>
